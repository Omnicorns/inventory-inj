spring.application.name=product-bundling


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

api.key=${API_KEY}




http.client.max-connections=300
http.client.max-per-route=100
http.client.connection-request-timeout=20000
http.client.connect-timeout=20000
http.client.read-timeout=20000

server.port=8089
server.address=0.0.0.0

sarinah-portal.base-url=  https://192.168.70.98/api/public
sarinah-portal.product_inj.url =${sarinah-portal.base-url}/product_inj

#spring.kafka.bootstrap-servers=10.0.7.32:9092



spring.thymeleaf.prefix= classpath:/templates/
spring.thymeleaf.suffix= .html

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


spring.thymeleaf.cache=false

server.forward-headers-strategy=framework

server.servlet.contextPath=/dev

spring.task.scheduling.pool.size=1

# Akun admin UI: wajib diisi lewat environment, tidak ada nilai bawaan
app.security.admin-username=${INJ_ADMIN_USERNAME}
app.security.admin-password=${INJ_ADMIN_PASSWORD}

# true hanya bila jaringan melakukan inspeksi TLS (antivirus/proxy) dan sertifikatnya belum diimpor ke JVM.
# Lebih baik impor CA perusahaan ke truststore Java daripada mengaktifkan ini.
http.client.insecure-ssl=${HTTP_CLIENT_INSECURE_SSL:false}
