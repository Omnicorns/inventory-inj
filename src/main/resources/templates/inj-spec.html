<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>INJ Spec - Catalogue</title>

    <!-- Bootstrap simple saja biar rapi -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page-wrap {
            max-width: 1200px;
            margin: 24px auto;
        }
        .card {
            border-radius: 16px;
            border: 1px solid #e1e4ef;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .07);
        }
        .product-img {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f2f8;
        }
        table thead {
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
        }
        .table-responsive {
            max-height: 420px;
            border-radius: 12px;
            border: 1px solid #e1e4ef;
        }
        .input-xs {
            max-width: 90px;
        }
        .price-cell {
            white-space: nowrap;
        }
        .switch-active {
            transform: scale(1.1);
        }
        .summary-text {
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- BAR USER SESSION + BACK + LOGOUT -->
    <div class="d-flex justify-content-between align-items-center mb-3 small">
        <div>
            Login sebagai:
            <strong sec:authentication="name">user</strong>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/catalogue-ui/inj-spec-list}"
               class="btn btn-outline-secondary btn-sm">
                ← Kembali ke List
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-link btn-sm p-0">
                    Logout
                </button>
            </form>
        </div>
    </div>

    <!-- HEADER PRODUK -->
    <div class="card mb-4">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div>
                    <!-- ✅ panggil sebagai data URL -->
                    <img th:if="${spec.imageBase64 != null}"
                         th:src="'data:image/jpeg;base64,' + ${spec.imageBase64}"
                         alt="Product Image"
                         class="product-img border"/>
                    <div th:if="${spec.imageBase64 == null}"
                         class="product-img d-flex align-items-center justify-content-center text-muted">
                        No Image
                    </div>
                </div>
                <div>
                    <div class="text-muted mb-1" style="font-size: 0.8rem;">INJ SPECIFICATION</div>
                    <h5 class="mb-1" th:text="${spec.productName}">Nama Produk</h5>
                    <div class="text-muted">
                        SKU:
                        <span class="fw-semibold" th:text="${spec.sku}">SKU-XXX</span>
                        &nbsp;&nbsp;|&nbsp;&nbsp;
                        Odoo ID:
                        <span class="fw-semibold" th:text="${spec.odooProductId}">0</span>
                    </div>
                    <div class="text-muted summary-text mt-1">

                    </div>
                </div>
            </div>
            <div class="text-end">
                <button type="button"
                        id="btnSave"
                        class="btn btn-success px-4">
                    Simpan Konfigurasi
                </button>
                <div class="small text-muted mt-2" id="saveStatus"></div>
            </div>
        </div>
    </div>

    <!-- TABEL SPESIFIKASI PER LOKASI -->
    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
            <div>

                </div>
            </div>
        </div>
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead class="text-nowrap">
                    <tr class="table-light">
                        <th class="text-center">#</th>
                        <th>Location</th>
                        <th>Pricelist</th>
                        <th class="text-end">Stock Odoo</th>
                        <th class="text-end">Sell Stock INJ</th>
                        <th class="text-end">Limit Stock (Config)</th>
                        <th class="text-end">Base Price</th>
                        <th>Mode</th>
                        <th class="text-end">Add %</th>
                        <th class="text-end">Margin %</th>
                        <th class="text-end">Sell Price</th>
                        <th class="text-center">Active</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row,iter : ${rows}"
                        th:attr="data-location-id=${row.locationId},
                                 data-qty-odoo=${row.quantityOdoo},
                                 data-base-price=${row.basePrice}">
                        <td class="text-center" th:text="${iter.index + 1}">1</td>

                        <td th:text="${row.locationName}">THA/Stock/JPO</td>
                        <td th:text="${row.pricelistName}">Pricelist</td>

                        <!-- Stock Odoo (display) -->
                        <td class="text-end js-qty-odoo"
                            th:text="${#numbers.formatInteger(row.quantityOdoo, 0, 'POINT')}">
                            0
                        </td>

                        <!-- Sell Stock INJ (hasil perhitungan: qty - limit) -->
                        <td class="text-end js-sell-stock"
                            th:text="${#numbers.formatInteger(row.stock, 0, 'POINT')}">
                            0
                        </td>

                        <!-- Limit Stock CONFIG (boleh diubah manual) -->
                        <td class="text-end">
                            <input type="number" step="1" min="0"
                                   class="form-control form-control-sm d-inline-block input-xs js-limit-input text-end"
                                   th:value="${row.limitStock}"/>
                        </td>

                        <!-- Base Price (display) -->
                        <td class="text-end price-cell js-base-price"
                            th:text="${#numbers.formatInteger(row.basePrice, 0, 'POINT')}">
                            0
                        </td>

                        <!-- Mode harga -->
                        <td>
                            <select class="form-select form-select-sm js-pricing-mode">
                                <option value="NONE"
                                        th:selected="${row.pricingMode == 'NONE'}">NONE</option>
                                <option value="ADDED_VALUE"
                                        th:selected="${row.pricingMode == 'ADDED_VALUE'}">ADDED_VALUE</option>
                                <option value="MARGIN"
                                        th:selected="${row.pricingMode == 'MARGIN'}">MARGIN</option>
                            </select>
                        </td>

                        <!-- Added & Margin -->
                        <td class="text-end">
                            <input type="number" step="0.01"
                                   class="form-control form-control-sm d-inline-block input-xs text-end js-added"
                                   th:value="${row.addedValuePct}"/>
                        </td>
                        <td class="text-end">
                            <input type="number" step="0.01"
                                   class="form-control form-control-sm d-inline-block input-xs text-end js-margin"
                                   th:value="${row.marginInjPct}"/>
                        </td>

                        <!-- Sell Price (display, dihitung dari mode) -->
                        <td class="text-end price-cell js-sell-price"
                            th:text="${#numbers.formatInteger(row.sellPrice, 0, 'POINT')}">
                            0
                        </td>

                        <!-- Active -->
                        <td class="text-center">
                            <input type="checkbox"
                                   class="form-check-input switch-active js-active"
                                   th:checked="${row.active}"/>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="12" class="text-center text-muted py-4">
                            Tidak ada data stock untuk produk ini.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const API_BASE = /*[[@{/sarinah-forwarder/v1/catalogue}]]*/ "/sarinah-forwarder/v1/catalogue";
    const ODOO_PRODUCT_ID = /*[[${spec.odooProductId}]]*/ 0;

    function formatNumberId(n) {
        if (isNaN(n)) return "0";
        return n.toLocaleString('id-ID');
    }

    function recalcRow(tr) {
        const qty = parseFloat(tr.getAttribute("data-qty-odoo") || "0");
        const basePrice = parseFloat(tr.getAttribute("data-base-price") || "0");

        const limitInput  = tr.querySelector(".js-limit-input");
        const sellStockEl = tr.querySelector(".js-sell-stock");

        const modeSelect  = tr.querySelector(".js-pricing-mode");
        const addedInput  = tr.querySelector(".js-added");
        const marginInput = tr.querySelector(".js-margin");
        const sellPriceEl = tr.querySelector(".js-sell-price");

        // 1) Baca limitStock (konfigurasi)
        let limitStock = limitInput && limitInput.value !== ""
            ? parseFloat(limitInput.value)
            : 0;
        if (isNaN(limitStock)) limitStock = 0;
        if (limitStock < 0) limitStock = 0;

        // 2) Hitung sellStock = max(qty - limitStock, 0)
        let sellQty = qty - limitStock;
        if (sellQty < 0) sellQty = 0;

        if (sellStockEl) {
            sellStockEl.textContent = formatNumberId(Math.floor(sellQty));
        }

        // 3) Hitung Sell Price berdasarkan mode
        let addedPct = addedInput && addedInput.value !== ""
            ? parseFloat(addedInput.value) : 0;
        let marginPct = marginInput && marginInput.value !== ""
            ? parseFloat(marginInput.value) : 0;

        let sellPrice = basePrice;

        if (modeSelect) {
            const mode = modeSelect.value || "NONE";
            if (mode === "ADDED_VALUE") {
                sellPrice = basePrice * (1 + (addedPct / 100.0));
            } else if (mode === "MARGIN") {
                if (marginPct >= 100) {
                    sellPrice = 0;
                } else {
                    sellPrice = basePrice / (1 - (marginPct / 100.0));
                }
            }
        }

        if (sellPriceEl) {
            sellPriceEl.textContent = formatNumberId(Math.round(sellPrice));
        }
    }

    function recalcAllRows() {
        document.querySelectorAll("tbody tr[data-location-id]").forEach(tr => {
            recalcRow(tr);
        });
    }

    function attachRowListeners() {
        document.querySelectorAll("tbody tr[data-location-id]").forEach(tr => {
            const limitInput  = tr.querySelector(".js-limit-input");
            const modeSelect  = tr.querySelector(".js-pricing-mode");
            const addedInput  = tr.querySelector(".js-added");
            const marginInput = tr.querySelector(".js-margin");

            if (limitInput) {
                limitInput.addEventListener("input", () => recalcRow(tr));
            }
            if (modeSelect) {
                modeSelect.addEventListener("change", () => recalcRow(tr));
            }
            if (addedInput) {
                addedInput.addEventListener("input", () => recalcRow(tr));
            }
            if (marginInput) {
                marginInput.addEventListener("input", () => recalcRow(tr));
            }
        });
    }

    function collectRowsPayload() {
        const rows = [];
        document.querySelectorAll("tbody tr[data-location-id]").forEach(tr => {
            const locationId = parseInt(tr.getAttribute("data-location-id"));

            const limitInput = tr.querySelector(".js-limit-input");
            const modeSelect = tr.querySelector(".js-pricing-mode");
            const addedInput = tr.querySelector(".js-added");
            const marginInput= tr.querySelector(".js-margin");
            const activeCheck= tr.querySelector(".js-active");

            let limitStock = limitInput && limitInput.value !== ""
                ? parseFloat(limitInput.value)
                : 0;
            if (isNaN(limitStock)) limitStock = 0;

            const payloadRow = {
                locationId: isNaN(locationId) ? null : locationId,
                pricingMode: modeSelect ? (modeSelect.value || "NONE") : "NONE",
                addedValuePct: addedInput && addedInput.value ? parseFloat(addedInput.value) : 0,
                marginInjPct: marginInput && marginInput.value ? parseFloat(marginInput.value) : 0,
                // 👉 kirim sebagai stockPctToInj, tapi MAKNA-nya = limitStock (qty)
                stockPctToInj: limitStock,
                active: activeCheck ? activeCheck.checked : true
            };

            rows.push(payloadRow);
        });
        return rows;
    }

    async function saveConfig() {
        const statusEl = document.getElementById("saveStatus");
        const btnSave  = document.getElementById("btnSave");

        statusEl.textContent = "Menyimpan...";
        statusEl.classList.remove("text-success", "text-danger");
        if (btnSave) btnSave.disabled = true;

        const payload = collectRowsPayload();

        try {
            const resp = await fetch(`${API_BASE}/save/inj-spec/${ODOO_PRODUCT_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) {
                throw new Error("HTTP " + resp.status);
            }

            statusEl.textContent = "Berhasil disimpan. Memuat ulang...";
            statusEl.classList.add("text-success");

            setTimeout(() => {
                window.location.reload();
            }, 800);

        } catch (e) {
            console.error(e);
            statusEl.textContent = "Gagal menyimpan konfigurasi.";
            statusEl.classList.remove("text-success");
            statusEl.classList.add("text-danger");
            if (btnSave) btnSave.disabled = false;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const btnSave = document.getElementById("btnSave");
        if (btnSave) {
            btnSave.addEventListener("click", saveConfig);
        }

        attachRowListeners();
        recalcAllRows(); // inisialisasi awal (kalibrasi ulang sell stock & harga)
    });
</script>

</body>
</html>
