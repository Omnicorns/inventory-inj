<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Inventory INJ</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <style>
        body{
            background:#f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .login-wrap{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .login-card{
            max-width:380px;
            width:100%;
            border-radius:18px;
            border:1px solid #e5e7eb;
            box-shadow:0 18px 45px rgba(15,23,42,.12);
            background:#fff;
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card p-4">
        <h5 class="mb-1 text-center">Inventory INJ</h5>
        <p class="text-muted small text-center mb-4">Silakan login terlebih dahulu</p>

        <!-- pesan error dari ?error -->
        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            Username atau password salah.
        </div>

        <!-- pesan logout dari ?logout -->
        <div th:if="${param.logout}" class="alert alert-success py-2 small">
            Anda sudah logout.
        </div>

        <!-- form login -->
        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label small">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

            <p class="text-muted small mt-3 mb-0">

            </p>
        </form>
    </div>
</div>

</body>
</html>
